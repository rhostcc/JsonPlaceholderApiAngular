<div class="flex flex-col w-11/12 pl-30 pt-20">
  <p class="text-4xl">Lista de usuarios</p>
  <div class="pt-5">
    <button
      class="bg-green-200 border border-green-500 px-4 py-2 rounded-xl hover:bg-green-300 cursor-pointer text-green-600 font-bold"
    >
      CrearUsuario
    </button>
  </div>
  <div class="overflow-x-auto pb-4 pt-4">
    <div class="min-w-full inline-block align-middle">
      <div class="overflow-hidden border rounded-lg border-gray-300">
        <table class="table-auto min-w-full rounded-xl">
          <thead>
            <tr class="bg-gray-50">
              <th
                scope="col"
                class="p-5 text-left whitespace-nowrap text-sm leading-6 font-semibold text-gray-900 capitalize"
              >
                Id
              </th>
              <th
                scope="col"
                class="p-5 text-left whitespace-nowrap text-sm leading-6 font-semibold text-gray-900 capitalize"
              >
                Username
              </th>
              <th
                scope="col"
                class="p-5 text-left whitespace-nowrap text-sm leading-6 font-semibold text-gray-900 capitalize min-w-[150px]"
              >
                Email
              </th>
              <th
                scope="col"
                class="p-5 text-left whitespace-nowrap text-sm leading-6 font-semibold text-gray-900 capitalize"
              >
                Phone
              </th>
              <th
                scope="col"
                class="p-5 text-left whitespace-nowrap text-sm leading-6 font-semibold text-gray-900 capitalize"
              >
                Website
              </th>
              <th
                scope="col"
                class="p-5 text-left whitespace-nowrap text-sm leading-6 font-semibold text-gray-900 capitalize"
              >
                Actions
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-300">
            @if (loading()) {
              <tr class="bg-white transition-all duration-500 hover:bg-gray-50">
                <td colspan="6">Cargando datos desde el API</td>
              </tr>
            } @else if (error()) {
              <tr class="bg-white transition-all duration-500 hover:bg-gray-50">
                <td colspan="6">El error es {{ error() }}</td>
              </tr>
            } @else {
              @for (usuario of users(); track usuario.id) {
                <tr
                  app-user-item-component
                  usuario="usuario"
                  class="bg-white transition-all duration-500 hover:bg-gray-50"
                ></tr>
              }
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
